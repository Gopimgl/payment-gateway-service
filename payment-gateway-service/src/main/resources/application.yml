spring:
  application:
    name: payment-gateway-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: 5106
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway migrations
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Payment Gateway Service
    version: 1.0.0
    description: HTTP payment service with mock gateway and callback handling

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

payment:
  gateway:
    base-url: http://localhost:${server.port:8080}/mock-gateway
    callback-url: http://localhost:${server.port:8080}/api/v1/payments/callback
    callback-secret: ${CALLBACK_SECRET:mock-secret}
    connect-timeout: 1s
    read-timeout: 2s
    max-attempts: 3
    retry-backoff: 200ms
    mock-hang-time: 4s              # how long the mock bank stalls for the timeout case (scenario TIMEOUT)
    mock-callback-delay: 1500ms     # delay before async callbacks
    mock-late-callback-delay: 6s    # callback sent after a timeout (resolves UNKNOWN)

  reconciliation:
    interval-ms: 30000     # how often the reconciliation job runs
    stale-after-ms: 60000  # PENDING/UNKNOWN payments older than this are checked with the bank

logging:
  level:
    com.matrix.payments: INFO
